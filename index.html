
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão: Inteligência Artificial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="caixa-principal">
        <section class="tela-inicial">
            <h1>Missão: Inteligência Artificial</h1>
            <p>
                Estamos em 2049. A Inteligência Artificial está cada vez
                mais presente em nossas vidas. Suas escolhas vão ajudar
                a construir uma reflexão sobre o futuro da humanidade.
            </p>
            <button id="botao-iniciar">Iniciar</button>
        </section>

        <section class="jogo" hidden>
            <div class="caixa-perguntas"></div>
            <div class="caixa-alternativas"></div>
        </section>

        <section class="caixa-resultado" hidden>
            <h2>O futuro está em nossas mãos!</h2>
            <p class="texto-resultado"></p>
            <button id="botao-reiniciar">Jogar Novamente</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
